<title>US Watches | Temporarily Unavailable</title>

<style>
    :root {
        --ivory: #f7f2e8;
        --ivory-light: #fcfaf5;
        --emerald: #0f7054;
        --emerald-dark: #0a4939;
        --emerald-deep: #062b22;
        --gold: #c9a961;
        --gold-light: #dfc78f;
        --charcoal: #1c211f;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 50% 42%, rgba(201, 169, 97, .10), transparent 28%),
            linear-gradient(135deg, var(--emerald-deep), var(--emerald-dark) 55%, #0b3d31);
        color: var(--ivory);
        font-family: "Montserrat", sans-serif;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 22px;
        border: 1px solid rgba(201, 169, 97, .38);
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 31px;
        border: 1px solid rgba(247, 242, 232, .08);
        pointer-events: none;
    }

    .maintenance {
        width: min(720px, calc(100% - 70px));
        padding: 60px 35px;
        text-align: center;
        position: relative;
    }

    .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
    }

    .brand-mark {
        width: 88px;
        height: 88px;
    }

    /* APPROVED US WATCHES LOGO — UNCHANGED */
    .luxury-mark {
        overflow: visible;
    }

    .luxury-mark .outer-ring {
        fill: none;
        stroke: #c9a961;
        stroke-width: 1.2;
    }

    .luxury-mark .inner-ring {
        fill: none;
        stroke: rgba(201, 169, 97, .42);
        stroke-width: .7;
    }

    .luxury-mark .inner-face {
        fill: none;
        stroke: rgba(245, 241, 232, .13);
        stroke-width: .5;
    }

    .luxury-mark .gold {
        fill: #c9a961;
    }

    .luxury-mark .ivory {
        fill: none;
        stroke: #f5f1e8;
    }

    .luxury-mark .fine {
        fill: none;
        stroke: #c9a961;
        stroke-width: .8;
        stroke-linecap: round;
    }

    .luxury-mark .crown {
        fill: none;
        stroke: #c9a961;
        stroke-width: .9;
        stroke-linejoin: round;
    }

    .luxury-mark .monogram-u {
        fill: none;
        stroke: #f5f1e8;
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .luxury-mark .monogram-s {
        fill: none;
        stroke: #c9a961;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .luxury-mark .hour-hand {
        stroke: #f5f1e8;
        stroke-width: 1.25;
        stroke-linecap: round;
    }

    .luxury-mark .minute-hand {
        stroke: #c9a961;
        stroke-width: 1;
        stroke-linecap: round;
    }

    .eyebrow {
        margin: 0 0 14px;
        color: var(--gold-light);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .30em;
        text-transform: uppercase;
    }

    h1 {
        margin: 0;
        color: var(--ivory-light);
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(48px, 8vw, 76px);
        font-weight: 600;
        line-height: .95;
        letter-spacing: .01em;
    }

    .rule {
        width: 76px;
        height: 1px;
        margin: 28px auto;
        background: linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
    }

    .message {
        max-width: 570px;
        margin: 0 auto;
        color: rgba(247, 242, 232, .82);
        font-size: 14px;
        line-height: 1.9;
        letter-spacing: .03em;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 12px 20px;
        border: 1px solid rgba(201, 169, 97, .34);
        background: rgba(255, 255, 255, .025);
        color: var(--gold-light);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .20em;
        text-transform: uppercase;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 12px rgba(201, 169, 97, .65);
    }

    .footer {
        margin-top: 42px;
        color: rgba(247, 242, 232, .42);
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
    }

    @media (max-width: 600px) {
        body::before {
            inset: 12px;
        }

        body::after {
            inset: 19px;
        }

        .maintenance {
            width: calc(100% - 42px);
            padding: 40px 12px;
        }

        .brand-mark {
            width: 76px;
            height: 76px;
        }

        h1 {
            font-size: 52px;
        }

        .message {
            font-size: 13px;
        }
    }
</style>
